<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴 등록 - 카페 관리자</title>
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="create.css">
</head>
<body>
  <header class="admin-header">
    <div class="container admin-header-inner">
      <div class="logo">☕ 카페 관리자</div>
      <a href="list.html" class="btn btn-outline">목록으로</a>
    </div>
  </header>

  <div class="container page">
    <h1>메뉴 등록</h1>
    <form id="create-form" class="glass form-card">
      <div class="form-group">
        <label for="name">메뉴명</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="category">카테고리</label>
        <select id="category">
          <option value="커피">커피</option>
          <option value="음료">음료</option>
          <option value="디저트">디저트</option>
        </select>
      </div>
      <div class="form-group">
        <label for="price">가격 (원)</label>
        <input type="number" id="price" min="0" step="100" required>
      </div>
      <div class="form-group">
        <label for="description">설명</label>
        <textarea id="description" rows="3"></textarea>
      </div>
      <div id="form-error" class="form-error" style="display:none;"></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">등록</button>
        <a href="list.html" class="btn btn-outline">취소</a>
      </div>
    </form>
  </div>

  <script src="../../js/data.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="create.js"></script>
</body>
</html>
